server:
  port: ${PORT:9090}
  address: 127.0.0.1
  shutdown: graceful
spring:
  application:
    name: hotel-service
  datasource:
    url: ${HOTEL_DB_URL:jdbc:h2:file:./data/hotel;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${HOTEL_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  sql:
    init:
      mode: always
  lifecycle:
    timeout-per-shutdown-phase: 10s
saga:
  worker-enabled: true
  poll-ms: 1000
  retry-ms: 2000
  lease-ms: 30000
  batch-size: 10
payment:
  base-url: ${PAYMENT_BASE_URL:}
  timeout-ms: 500
simulator:
  enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
