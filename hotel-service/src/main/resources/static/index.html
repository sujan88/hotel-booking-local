<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local hotel checkout simulator</title>
<style>body{font:16px system-ui;max-width:720px;margin:48px auto;padding:0 24px;background:#f7fafc;color:#17324d}form,section{background:white;padding:24px;border:1px solid #d9e2ec;border-radius:12px;margin:20px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:8px;border:1px solid #9fb3c8;border-radius:5px}input{display:block;width:90%}button{background:#174e78;color:white;cursor:pointer;margin:8px 8px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block}</style>
<h1>Hotel checkout simulator</h1>
<p><strong>Local simulation only. No money is collected.</strong> Do not enter card details. This stands in for a provider-hosted secure payment form.</p>
<form id="checkout">
<label>Hotel <input name="hotelId" value="h1" required></label><label>Room <select name="roomId"><option>r1</option><option>r2</option></select></label>
<label>Check-in <input name="checkIn" type="date" value="2027-01-01" required></label><label>Check-out <input name="checkOut" type="date" value="2027-01-02" required></label>
<label>Guests <input name="guests" type="number" min="1" max="20" value="2" required></label>
<label>Guest name <input name="guestName" value="Alex Guest" required></label><label>Email <input name="guestEmail" type="email" value="alex@example.com" required></label>
<button type="submit">Simulate payment collection and reserve</button><small>The backend calculates the amount. One key is retained for retries of this booking. Reload to start a different booking.</small>
</form>
<section><button id="status">Check reservation status</button><button id="summary">Show simulator summary</button><pre id="result" aria-live="polite">Ready.</pre></section>
<script>
const key=crypto.randomUUID();let token=null,id=null;
const output=document.querySelector('#result');
async function json(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok)throw Error(JSON.stringify(body));return body;}
const post=body=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
document.querySelector('#checkout').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;
try{if(!token)token=(await json('/simulator/payment-methods',{method:'POST'})).paymentMethodToken;
const body=Object.fromEntries(new FormData(event.target));body.guests=Number(body.guests);body.paymentMethodToken=token;
const options=post(body);options.headers['Idempotency-Key']=key;const result=await json('/reservations',options);id=result.reservationId;output.textContent=JSON.stringify(result,null,2);
}catch(error){output.textContent=error.message;}finally{button.disabled=false;}});
document.querySelector('#status').onclick=async()=>{if(!id){output.textContent='Create a reservation first.';return;}try{output.textContent=JSON.stringify(await json('/reservations/'+encodeURIComponent(id)),null,2);}catch(error){output.textContent=error.message;}};
document.querySelector('#summary').onclick=async()=>{try{output.textContent=JSON.stringify(await json('/simulator/summary'),null,2);}catch(error){output.textContent=error.message;}};
</script></html>
